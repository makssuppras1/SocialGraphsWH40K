[project]
name = "sogra-final-assignment"
version = "0.1.0"
description = "Social graphs and interactions final assignment"
requires-python = ">=3.12"
dependencies = [
    "networkx==3.5",
    "numpy==2.3.4",
    "matplotlib==3.10.7",
    "scipy==1.16.3",
    "sentence-transformers",
    "scikit-learn",
    "python-louvain",
    "pandas",
    "seaborn",
    "plotly",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

